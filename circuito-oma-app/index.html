<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circuito OMA Pádel</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: un teléfono centrado sobre un fondo neutro profundo; dentro, una app oscura
   de una sola dirección visual (azul noche + lima). Single-theme por decisión. */
:root {
  --page: #0A1121;
  --navy: #101B30;
  --s1: #16233D;
  --s2: #1D2C4A;
  --s3: #24365A;
  --line: rgba(245, 246, 242, 0.10);
  --line-2: rgba(245, 246, 242, 0.18);
  --fg: #F5F6F2;
  --muted: rgba(245, 246, 242, 0.64);
  --muted-2: rgba(245, 246, 242, 0.42);
  --lime: #C2F34A;
  --lime-ink: #101B30;
  --lime-soft: rgba(194, 243, 74, 0.14);
  --accent-text: #C2F34A;
  --bg: #101B30;
  --bar: rgba(16, 27, 48, 0.92);
  --ov-6: var(--ov-6);
  --ov-8: var(--ov-8);
  --ov-10: rgba(245, 246, 242, 0.10);
  --ov-14: var(--ov-14);
  --toast-bg: #F5F6F2;
  --toast-fg: #101B30;
  --avatar-a: #2A3D63;
  --avatar-b: #16233D;
  --avatar-real-a: #3B5280;
  --avatar-real-b: #1A2A4A;
  --ok: #6EE7A8;
  --warn: #F6C454;
  --danger: #F08A8A;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --sans: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
  --r-s: 8px;
  --dur: 200ms;
  color-scheme: dark;
}
/* Modo claro: blanco suave como superficie, azul noche como tinta, lima solo en acciones */
:root[data-oma-theme="light"] {
  --page: #DDE0D6;
  --bg: #F5F6F2;
  --s1: #FFFFFF;
  --s2: #ECEEE7;
  --s3: #E0E3DA;
  --line: rgba(16, 27, 48, 0.10);
  --line-2: rgba(16, 27, 48, 0.20);
  --fg: #101B30;
  --muted: rgba(16, 27, 48, 0.64);
  --muted-2: rgba(16, 27, 48, 0.42);
  --lime-soft: rgba(194, 243, 74, 0.32);
  --accent-text: #4A6A00;
  --bar: rgba(245, 246, 242, 0.94);
  --ov-6: rgba(16, 27, 48, 0.05);
  --ov-8: rgba(16, 27, 48, 0.07);
  --ov-10: rgba(16, 27, 48, 0.09);
  --ov-14: rgba(16, 27, 48, 0.13);
  --toast-bg: #101B30;
  --toast-fg: #F5F6F2;
  --avatar-a: #C9CFC2;
  --avatar-b: #AEB6A8;
  --avatar-real-a: #B9C6DE;
  --avatar-real-b: #8FA3C6;
  --ok: #1E8A55;
  --warn: #9A6A00;
  --danger: #B93C3C;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
#stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 14px; }
#root { display: contents; }
.page-caption { color: var(--muted-2); font-size: 12px; text-align: center; max-width: 420px; }
.page-caption b { color: var(--muted); font-weight: 600; }
.theme-switch { display: inline-flex; align-items: center; gap: 4px; margin-left: 12px; padding: 3px; border-radius: 999px; background: var(--ov-8); border: 1px solid var(--line); vertical-align: middle; }
.theme-switch button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.theme-switch button[aria-pressed="true"] { background: var(--lime); color: var(--lime-ink); }

/* ---------- Teléfono ---------- */
.device { position: relative; flex: none; margin: 14px 16px 18px; }
.side-btn { position: absolute; width: 4px; border-radius: 2px; background: #1C2538; box-shadow: inset 0 0 0 1px #2B3650; }
.side-btn--action { left: -15px; top: 150px; height: 30px; }
.side-btn--vol1 { left: -15px; top: 210px; height: 58px; }
.side-btn--vol2 { left: -15px; top: 282px; height: 58px; }
.side-btn--power { right: -15px; top: 236px; height: 92px; }
.phone {
  position: relative; width: 393px; height: 852px; background: var(--bg);
  border-radius: 48px; border: 1px solid var(--ov-8);
  box-shadow: 0 0 0 11px #0B0F17, 0 0 0 12px #2B3650, 0 40px 100px rgba(0, 0, 0, 0.6);
  overflow: hidden; display: flex; flex-direction: column; isolation: isolate;
}
.statusbar { height: 40px; flex: none; color: var(--fg); display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; z-index: 5; pointer-events: none; }
.statusbar__notch { display: none; }
.statusbar__icons { display: flex; gap: 6px; align-items: center; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; margin-top: -40px; padding-top: 40px; }
.content::-webkit-scrollbar { display: none; }
.screen-anim { animation: screen-in var(--dur) ease-out both; min-height: 100%; }
@keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.screen { padding-bottom: 96px; }
.screen--flush .stage-hero, .screen--flush .profile-hero { margin-top: -40px; }
.screen--modal { padding-bottom: 32px; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 86px; padding: 8px 10px 24px; display: flex; background: var(--bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); z-index: 6; }
.tabbar__item { flex: 1; background: none; border: 0; color: var(--muted); font: inherit; font-size: 11px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; border-radius: 10px; padding: 4px 0; transition: color var(--dur); }
.tabbar__item--active { color: var(--accent-text); }
.tabbar__icon { position: relative; width: 44px; height: 30px; display: grid; place-items: center; border-radius: 10px; transition: background var(--dur); }
.tabbar__item--active .tabbar__icon { background: var(--lime-soft); }
.tabbar__item--active .tabbar__label { font-weight: 600; }
.dot-badge { position: absolute; top: -4px; right: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--lime); color: var(--lime-ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
.dot-badge--sm { min-width: 9px; height: 9px; top: 2px; right: 8px; padding: 0; }

/* ---------- Tipografía ---------- */
.h-hero { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 40px; line-height: 0.92; letter-spacing: 0.005em; margin: 4px 0 8px; text-wrap: balance; }
.h-section { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 24px; line-height: 1; margin: 0; }
.h-profile { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 0.95; margin: 2px 0 6px; }
.h-sheet { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 26px; line-height: 1; margin: 0 0 12px; }
.h-step { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 28px; line-height: 1; margin: 4px 0 14px; }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.kicker--lime { color: var(--accent-text); }
.kicker--row { margin: 18px 0 8px; }
.lead { font-size: 15px; line-height: 1.5; color: var(--fg); margin: 0 0 16px; }
.body { font-size: 14px; line-height: 1.5; color: var(--fg); margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.strong { font-weight: 600; }
.center { text-align: center; }
.num { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
.lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.num-lg { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 26px; font-family: var(--display); font-style: italic; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }
.r { text-align: right; }
.pos-n { color: var(--ok); }
.neg-n { color: var(--danger); }

/* ---------- Controles ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 10px; padding: 0 18px; height: 48px; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform var(--dur), background var(--dur), opacity var(--dur); white-space: nowrap; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn--primary { background: var(--lime); color: var(--lime-ink); }
.btn--primary:disabled { background: var(--s3); color: var(--muted); opacity: 1; }
.btn--secondary { background: var(--s2); color: var(--fg); border-color: var(--line-2); }
.btn--ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn--full { width: 100%; }
.btn--small { height: 36px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--fg); display: grid; place-items: center; cursor: pointer; font: inherit; transition: background var(--dur); flex: none; }
.icon-btn:active { background: var(--s2); }
.icon-btn--ghost { pointer-events: none; }
.icon-btn--outline { border: 1px solid var(--line-2); background: var(--s1); border-radius: 12px; }
.icon-btn--active { border-color: var(--accent-text); color: var(--accent-text); }
.icon-btn--dark { background: rgba(16, 27, 48, 0.72); color: #F5F6F2; backdrop-filter: blur(6px); }
.avatar-btn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 50%; }
.link { background: none; border: 0; color: var(--accent-text); font: inherit; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 2px; cursor: pointer; padding: 4px 0; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.row { display: flex; align-items: center; }
.gap { gap: 10px; }
.gap-s { gap: 6px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack--tight { gap: 6px; }
.pad { padding: 14px 16px 0; }
.pad-x { padding-left: 16px; padding-right: 16px; }
.pad-y { padding-top: 14px; }
.pad-top { padding-top: 12px; }
.block { padding: 22px 16px 0; }
.cta-bar { margin: 16px 0 10px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
.block .section-head, .pad .section-head { margin-top: 0; }
.pad .section-head { margin-top: 18px; }
.pad > .section-head:first-child { margin-top: 0; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.chips--scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -16px; margin-right: -16px; padding: 2px 16px; }
.chips--scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line-2); background: transparent; color: var(--fg); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background var(--dur), color var(--dur), border-color var(--dur); white-space: nowrap; }
.chip--active { background: var(--lime); color: var(--lime-ink); border-color: var(--accent-text); font-weight: 600; }
.chip--alt { border-style: dashed; }
.chip--alt.chip--active { border-style: solid; }
.segmented { display: flex; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin: 0 0 12px; }
.segmented__item { flex: 1; height: 34px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: background var(--dur), color var(--dur); }
.segmented__item--active { background: var(--s3); color: var(--fg); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 8px; }
.tab { flex: 1; height: 44px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; position: relative; transition: color var(--dur); white-space: nowrap; padding: 0 4px; }
.tab--active { color: var(--fg); font-weight: 600; }
.tab--active::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 3px; background: var(--lime); border-radius: 2px 2px 0 0; }
.sticky-tabs { position: sticky; top: 0; z-index: 4; background: var(--bar); backdrop-filter: blur(10px); }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--ov-10); font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--fg); white-space: nowrap; }
.pill--x { cursor: pointer; background: var(--lime-soft); color: var(--accent-text); }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.st-scheduled { background: var(--ov-8); color: var(--fg); }
.st-live { background: var(--lime-soft); color: var(--accent-text); border-color: rgba(194, 243, 74, 0.35); }
.st-pending { background: rgba(246, 196, 84, 0.14); color: var(--warn); }
.st-finished { background: var(--ov-6); color: var(--muted); }
.st-open { background: var(--lime); color: var(--lime-ink); }
.st-mine { background: rgba(110, 231, 168, 0.14); color: var(--ok); }
.demo-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-2); border: 1px dashed var(--line-2); border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
.trend { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.trend--up { color: var(--ok); }
.trend--down { color: var(--danger); }
.trend--same { color: var(--muted); }
.trend--new { color: var(--accent-text); }

.search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line); color: var(--muted); flex: 1; min-width: 0; margin-bottom: 12px; }
.search input { flex: 1; min-width: 0; background: none; border: 0; color: var(--fg); font: inherit; font-size: 14px; outline: none; }
.search input::placeholder { color: var(--muted-2); }
.search input::-webkit-search-cancel-button { filter: invert(1); }
.search-row { display: flex; gap: 8px; align-items: flex-start; padding: 4px 16px 0; }
.search-row .icon-btn { width: 44px; height: 44px; }
.filter-summary { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 16px 8px; }
.result-count { padding: 0 16px; font-size: 12px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field__label { font-size: 12px; font-weight: 600; color: var(--muted); }
.select-wrap { position: relative; display: flex; align-items: center; }
.select-wrap select { width: 100%; height: 46px; appearance: none; -webkit-appearance: none; background: var(--s1); border: 1px solid var(--line-2); border-radius: 10px; color: var(--fg); font: inherit; padding: 0 40px 0 12px; }
.select-wrap svg { position: absolute; right: 12px; pointer-events: none; color: var(--muted); }

/* ---------- Avatares ---------- */
.avatar { display: inline-grid; place-items: center; line-height: 1; object-fit: cover; font-weight: 700; letter-spacing: 0.02em; flex: none; background: var(--s3); color: var(--fg); border: 1px solid var(--ov-8); }
.avatar--ph { background: linear-gradient(145deg, var(--avatar-a), var(--avatar-b)); }
.avatar--real { background: linear-gradient(145deg, var(--avatar-real-a), var(--avatar-real-b)); }
.avatar--tbd { color: var(--muted-2); border-style: dashed; background: transparent; border-radius: 50%; display: inline-grid; place-items: center; }
img.avatar { border: 0; object-position: 50% 12%; }
.pair-avatars { display: inline-flex; flex: none; position: relative; align-items: center; }
.pair-avatars .avatar:nth-child(2) { margin-left: -38%; box-shadow: 0 0 0 2px var(--bg); }
.pair-names { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; font-weight: 500; font-size: 13px; }
.pair-names > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flag { display: inline-block; margin-right: 5px; line-height: 1; vertical-align: -1px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.pair-names--tbd { color: var(--muted-2); font-style: italic; font-weight: 400; }

/* ---------- Recursos gráficos (slots de foto) ---------- */
.court-art { position: absolute; inset: 0; overflow: hidden; }
.court-art svg { width: 100%; height: 100%; display: block; }
.court-art--band svg { opacity: 0.9; }
.stage-photo { position: relative; overflow: hidden; background: var(--s1); }
.stage-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.stage-photo--hero img { object-position: 50% 20%; }
.stage-photo--card { width: 96px; height: 96px; border-radius: 10px; flex: none; }
.stage-photo--hero { position: absolute; inset: 0; }

/* ---------- Inicio ---------- */
.home-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 8px; }
.home-header__actions { display: flex; align-items: center; gap: 6px; }
.oma-logo { display: inline-flex; align-items: baseline; gap: 8px; }
.oma-logo__word { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: -0.01em; color: var(--fg); }
.oma-logo__word::after { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--lime); margin-left: 3px; transform: skewX(-12deg); vertical-align: baseline; }
.oma-logo__desc { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.oma-logo--sm .oma-logo__word { font-size: 22px; }
.hero { position: relative; margin: 4px 16px 0; height: 340px; border-radius: 16px; overflow: hidden; cursor: pointer; border: 1px solid var(--line); isolation: isolate; }
.hero__content, .stage-hero__content, .stage-card__overlay { --fg: #F5F6F2; --muted: rgba(245, 246, 242, 0.7); --accent-text: #C2F34A; --lime-soft: rgba(194, 243, 74, 0.16); --ok: #6EE7A8; --ov-6: rgba(245, 246, 242, 0.08); --ov-8: rgba(245, 246, 242, 0.1); --ov-10: rgba(245, 246, 242, 0.14); color: var(--fg); }
.phone[data-flush="1"] .statusbar { color: #F5F6F2; }
.phone[data-flush="0"] .statusbar { background: var(--bg); }
.hero__content { position: absolute; inset: auto 0 0 0; padding: 18px 16px 16px; background: linear-gradient(180deg, rgba(16, 27, 48, 0) 0%, rgba(16, 27, 48, 0.82) 35%, rgba(16, 27, 48, 0.97) 100%); }
.hero__top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.hero__day { font-size: 11px; font-weight: 600; color: var(--muted); }
.hero__meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.hero__meta span { display: inline-flex; align-items: center; gap: 5px; }
.hero__cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hero__cta { margin-top: 14px; }
.hero__cta .btn { width: 100%; }
.next-match { width: 100%; text-align: left; background: var(--s1); border: 1px solid var(--line-2); border-left: 3px solid var(--lime); border-radius: var(--r); padding: 12px 14px; color: var(--fg); font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
.next-match__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.next-match__cat { font-size: 12px; font-weight: 600; color: var(--muted); }
.next-match__teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.next-match__team { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.next-match__team--r { align-items: flex-end; text-align: right; }
.next-match__team .pair-names { font-size: 14px; }
.next-match__tag { font-size: 10px; font-weight: 700; color: var(--accent-text); letter-spacing: 0.08em; text-transform: uppercase; }
.next-match__vs { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 22px; color: var(--muted-2); }
.next-match__foot { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.next-match__foot span { display: inline-flex; align-items: center; gap: 5px; }
.notice { width: 100%; display: flex; align-items: center; gap: 12px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.notice__icon { width: 34px; height: 34px; border-radius: 9px; background: var(--lime-soft); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.notice__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.notice__title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.notice__body { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; }
.hscroll::-webkit-scrollbar { display: none; }
.stage-mini { flex: none; width: 212px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; color: var(--fg); font: inherit; text-align: left; cursor: pointer; padding: 0; }
.stage-mini .stage-photo--card { width: 100%; height: 100px; border-radius: 0; }
.stage-mini__body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.stage-mini__kicker { font-size: 11px; color: var(--muted); font-weight: 600; }
.stage-mini__name { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 20px; line-height: 1; }
.rank-summary { width: 100%; display: flex; align-items: center; gap: 14px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; color: var(--fg); font: inherit; text-align: left; cursor: pointer; flex-wrap: wrap; }
.rank-summary__pos { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
.rank-summary__num { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 44px; line-height: 0.9; color: var(--accent-text); }
.rank-summary__cat { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; text-align: center; }
.rank-summary__stats { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; min-width: 0; }
.rank-summary__stats > div { display: flex; flex-direction: column; gap: 2px; }
.rank-summary__stats .lbl { text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 500; }
.rank-summary .demo-tag { width: 100%; justify-content: center; }
.feature { width: 100%; display: grid; grid-template-columns: 132px 1fr; background: var(--s1); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; color: var(--fg); font: inherit; text-align: left; cursor: pointer; padding: 0; min-height: 170px; }
.feature__photo { position: relative; overflow: hidden; background: var(--s2); }
.feature__photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; }
.feature__ph { position: absolute; inset: 0; display: grid; place-items: center; }
.feature__initials { position: relative; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 54px; color: rgba(245, 246, 242, 0.85); }
.feature__word { position: absolute; left: -6px; bottom: -18px; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 76px; line-height: 1; color: var(--accent-text); opacity: 0.18; letter-spacing: -0.02em; pointer-events: none; }
.feature__body { padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 5px; justify-content: center; min-width: 0; }
.feature__name { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 0.95; }
.feature__line { font-size: 12px; color: var(--muted); }
.feature__line--demo { color: var(--muted-2); }
.home-foot { padding: 28px 16px 0; font-size: 11px; color: var(--muted-2); line-height: 1.5; display: flex; flex-direction: column; gap: 4px; }

/* ---------- Tarjeta de partido ---------- */
.match-card { width: 100%; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); color: var(--fg); font: inherit; text-align: left; cursor: pointer; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; transition: border-color var(--dur), background var(--dur); }
.match-card:active { background: var(--s2); }
.match-card__meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); min-width: 0; }
.match-card__code { font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
.match-card__phase, .match-card__stage { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.match-card__body { display: flex; flex-direction: column; gap: 6px; }
.team { display: grid; grid-template-columns: 4px 1fr auto; align-items: center; gap: 10px; min-width: 0; color: var(--muted); }
.team__mark { width: 4px; height: 26px; border-radius: 2px; background: var(--line-2); }
.team--won .team__mark { background: var(--lime); }
.team--won { color: var(--fg); }
.team--won .pair-names { font-weight: 600; }
.team--mine .pair-names { color: var(--accent-text); }
.sets { display: inline-flex; gap: 4px; font-variant-numeric: tabular-nums; }
.set { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; background: var(--ov-6); font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.set--won { background: var(--ov-14); color: var(--fg); }
.match-card__foot { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.match-card__foot > span { display: inline-flex; align-items: center; gap: 4px; }
.match-card__foot .badge { margin-left: auto; }
.match-card--compact { padding: 8px 12px; gap: 6px; }
.match-card--compact .pair-names { font-size: 12px; }

/* ---------- Etapas ---------- */
.stage-card { width: 100%; display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: center; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 10px; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.stage-card__overlay { position: absolute; left: 6px; top: 6px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.stage-card__overlay .badge { height: 20px; font-size: 10px; padding: 0 6px; }
.stage-card__body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stage-card__kicker { font-size: 11px; color: var(--muted); font-weight: 600; }
.stage-card__name { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 22px; line-height: 1; }
.stage-card__meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; min-width: 0; }
.stage-card__cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.stage-card__cats .pill { height: 20px; padding: 0 6px; font-size: 10px; }
.stage-card__chev { color: var(--muted-2); }
.topbar { display: flex; align-items: center; gap: 4px; padding: 4px 8px 8px; min-height: 52px; }
.topbar__title { flex: 1; min-width: 0; text-align: center; }
.topbar__h { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 22px; line-height: 1; }
.topbar__sub { font-size: 11px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar__right { min-width: 40px; display: flex; justify-content: flex-end; }

/* ---------- Detalle de etapa ---------- */
.stage-hero { position: relative; height: 330px; isolation: isolate; }
.stage-hero__bar { position: absolute; top: 46px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 2; }
.stage-hero__content { position: absolute; inset: auto 0 0 0; padding: 18px 16px 14px; background: linear-gradient(180deg, rgba(16, 27, 48, 0) 0%, rgba(16, 27, 48, 0.85) 40%, var(--navy) 100%); }
.stage-hero { background: var(--navy); }
.stage-hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--bg); }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.info-cell { display: flex; flex-direction: column; gap: 3px; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.info-cell > span:nth-child(2) { font-weight: 600; font-size: 13px; }
.info-cell--wide { margin: 0 0 16px; }
.cat-row { display: flex; align-items: center; gap: 12px; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.cat-row__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cat-row__name { font-weight: 600; }
.cat-row__meta { font-size: 12px; color: var(--muted); }
.meter { height: 4px; border-radius: 2px; background: var(--ov-10); overflow: hidden; margin-top: 2px; }
.meter span { display: block; height: 100%; background: var(--lime); border-radius: 2px; transition: width 300ms ease; }
.quick { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 12px 6px; color: var(--fg); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.quick svg { color: var(--accent-text); }
.expand { border: 1px solid var(--line); border-radius: 10px; margin: 16px 0; background: var(--s1); }
.expand__head { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; color: var(--fg); font: inherit; font-weight: 600; padding: 12px 14px; cursor: pointer; }
.expand__body { padding: 0 14px 12px; }
.rules { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); line-height: 1.55; }
.rules li { margin-bottom: 4px; }

/* ---------- Tablas ---------- */
.table-wrap { overflow-x: auto; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; }
.standings { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.standings th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.standings td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.standings tr:last-child td { border-bottom: 0; }
.standings .c-pos { width: 34px; text-align: center; padding-left: 8px; }
.standings .c-num { text-align: right; width: 34px; }
.standings .c-num.strong { color: var(--fg); }
.standings .c-team { min-width: 150px; }
.standings tr.row--q td { background: rgba(194, 243, 74, 0.05); }
.standings tr.row--mine td { background: rgba(194, 243, 74, 0.1); }
.standings tr.row--total td { background: rgba(245, 246, 242, 0.05); font-weight: 600; }
.standings--points td:first-child { padding-left: 12px; }
.standings--points th:first-child { padding-left: 12px; }
.pos { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--ov-8); font-weight: 700; font-size: 12px; }
.pos--q { background: var(--lime); color: var(--lime-ink); }
.team-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
.q-label { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--accent-text); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 3px; }
.q-label--muted { color: var(--muted-2); }
.glossary-link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; padding: 10px 12px; cursor: pointer; }
.group-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 4px 0 12px; }
.group-progress { text-align: right; display: flex; flex-direction: column; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 12px 0 14px; }

/* ---------- Bracket ---------- */
.bracket-top { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.champion-box { display: flex; align-items: center; gap: 10px; background: var(--lime); color: var(--lime-ink); border-radius: 10px; padding: 10px 12px; }
.champion-box .lbl { color: rgba(16, 27, 48, 0.7); }
.bracket { position: relative; display: flex; gap: 36px; overflow-x: auto; overflow-y: hidden; padding: 4px 16px 16px; scrollbar-width: thin; }
.bracket__lines { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
.ln { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.ln--won { stroke: var(--lime); stroke-opacity: 0.8; }
.round { display: flex; flex-direction: column; min-width: 228px; width: 228px; flex: none; }
.round__name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
.round__matches { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
.bk-match { position: relative; z-index: 1; background: var(--s1); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; color: var(--fg); font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.bk-match--done { border-color: var(--line); }
.bk-match__head { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-weight: 600; }
.bk-match__foot { display: flex; }
.bk-match__foot .badge { height: 18px; font-size: 10px; padding: 0 6px; }
.bk-team { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; color: var(--muted); min-width: 0; }
.bk-team__mark { width: 4px; height: 22px; border-radius: 2px; background: var(--line-2); }
.bk-team--won .bk-team__mark { background: var(--lime); }
.bk-team .pair-names { font-size: 11px; }
.bk-team--won { color: var(--fg); }
.bk-team--won .pair-names { font-weight: 600; }
.bk-team--mine .pair-names { color: var(--accent-text); }
.bk-team .set { width: 18px; height: 18px; font-size: 11px; }

/* ---------- Resultados / podio ---------- */
.podium { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.podium__item { background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.podium__item--1 { border-color: var(--accent-text); }
.podium__item--1 svg { color: var(--accent-text); }
.podium__item .strong { font-size: 13px; }
.podium .demo-tag { grid-column: 1 / -1; justify-self: start; }

/* ---------- Marcador ---------- */
.scoreboard { background: var(--s1); border: 1px solid var(--line-2); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
.scoreboard__head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; }
.sb-team { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; }
.sb-team--won { background: rgba(194, 243, 74, 0.06); box-shadow: inset 3px 0 0 var(--lime); }
.sb-team__players { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.sb-player { display: flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--fg); font: inherit; font-weight: 600; font-size: 14px; text-align: left; cursor: pointer; padding: 2px 0; min-width: 0; }
.sb-player span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-tbd { color: var(--muted-2); font-style: italic; padding: 8px 0; }
.sb-score { display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.sb-set { width: 30px; height: 36px; display: grid; place-items: center; border-radius: 6px; background: var(--ov-6); font-family: var(--display); font-style: italic; font-weight: 800; font-size: 22px; color: var(--muted); }
.sb-set--won { color: var(--fg); background: var(--ov-14); }
.sb-set--empty { color: var(--muted-2); }
.sb-total { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 6px; background: var(--lime); color: var(--lime-ink); font-family: var(--display); font-style: italic; font-weight: 800; font-size: 24px; margin-left: 4px; }
.sb-team:not(.sb-team--won) .sb-total { background: var(--ov-14); color: var(--fg); }
.sb-divider { display: flex; align-items: center; justify-content: space-between; padding: 2px 14px; font-family: var(--display); font-style: italic; font-weight: 800; color: var(--muted-2); font-size: 14px; }
.sb-sethead { display: flex; gap: 6px; }
.sb-sethead i { width: 30px; text-align: center; font-style: normal; font-family: var(--sans); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-2); font-weight: 600; }
.sb-sethead i:last-child { width: 36px; margin-left: 4px; }
.scoreboard__foot { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.scoreboard__foot span { display: inline-flex; align-items: center; gap: 5px; }
.sb-winner { display: flex; align-items: center; gap: 6px; padding: 10px 14px; background: var(--lime); color: var(--lime-ink); font-weight: 600; font-size: 13px; }
.sb-note { display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); line-height: 1.4; }
.sb-note svg { flex: none; margin-top: 1px; }
.ko-context { display: flex; flex-direction: column; gap: 10px; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.ko-context > div { display: flex; flex-direction: column; gap: 2px; }

/* ---------- Ranking ---------- */
.rank-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.my-rank { width: 100%; display: flex; align-items: center; gap: 10px; background: var(--s1); border: 1px solid var(--lime); border-radius: 10px; padding: 8px 12px; color: var(--fg); font: inherit; cursor: pointer; margin-bottom: 14px; }
.my-rank__pos { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 24px; color: var(--accent-text); }
.my-rank__txt { flex: 1; text-align: left; font-weight: 600; font-size: 13px; }
.podium-row { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px; align-items: end; margin-bottom: 12px; }
.podium-card { display: flex; flex-direction: column; align-items: center; gap: 5px; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px 10px; color: var(--fg); font: inherit; cursor: pointer; position: relative; min-width: 0; }
.podium-card--1 { order: 2; border-color: var(--accent-text); padding-top: 16px; }
.podium-card--2 { order: 1; }
.podium-card--3 { order: 3; }
.podium-card__pos { position: absolute; top: 8px; left: 10px; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 20px; color: var(--muted); }
.podium-card--1 .podium-card__pos { color: var(--accent-text); font-size: 26px; }
.podium-card__name { font-weight: 600; font-size: 12px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium-card__pts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rank-list { display: flex; flex-direction: column; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 6px; }
.rank-row { display: grid; grid-template-columns: 30px 1fr 64px 58px; align-items: center; gap: 8px; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.rank-row:last-child { border-bottom: 0; }
.rank-row--head { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; cursor: default; padding-top: 10px; padding-bottom: 10px; }
.rank-row--mine { background: rgba(194, 243, 74, 0.08); }
.rank-row--feat .rank-row__name { color: var(--accent-text); }
.rank-row--appm { grid-template-columns: 34px 1fr 64px 50px; }
.rank-row__pos { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); }
.rank-row__who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rank-row__names { display: flex; flex-direction: column; min-width: 0; }
.rank-row__name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row__partner { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row__pts { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.rank-row__trend { display: flex; justify-content: flex-end; }
.points-table { display: flex; flex-direction: column; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; }
.points-row { display: flex; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.points-row:last-child { border-bottom: 0; }

/* ---------- Perfil ---------- */
.profile-hero { position: relative; padding: 50px 16px 0; overflow: hidden; }
.profile-hero .court-art { height: 200px; inset: 0 0 auto 0; }
.profile-hero__cover { position: absolute; inset: 0 0 auto 0; height: 230px; overflow: hidden; }
.profile-hero__cover img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.profile-hero__cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16, 27, 48, 0.15) 0%, rgba(16, 27, 48, 0.3) 30%, var(--bg) 74%); }
.profile-hero .court-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16, 27, 48, 0.1), var(--bg)); }
