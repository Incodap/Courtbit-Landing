<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Términos y Condiciones | CourtBit</title>

<!-- /terms/ se consolidó en /legal/. Esta página se conserva SOLO como
     redirección: el Dashboard la enlaza desde los flujos de registro de
     jugadores (r/[shareCode]/unirme y t/[shareCode]/inscripcion), donde el
     usuario acepta los términos. Un 404 ahí rompería un consentimiento
     legal. No borrar hasta que esos enlaces apunten a /legal/. -->
<meta http-equiv="refresh" content="0; url=/legal/#terminos-jugadores">
<link rel="canonical" href="https://www.courtbit.com.mx/legal/">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico">
<style>
  :root { --paper:#ffffff; --bg:#fbfdfc; --navy:#10302a; --text-soft:#3c4a45; --blue:#15803d; --border:#e4eae7; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: var(--bg); color: var(--navy);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif; line-height: 1.6;
  }
  .card {
    max-width: 460px; text-align: center; background: var(--paper);
    border: 1px solid var(--border); border-radius: 20px; padding: 40px 32px;
    box-shadow: 0 1px 2px rgba(16,48,42,.04), 0 10px 28px rgba(16,48,42,.07);
  }
  img { height: 56px; width: auto; margin-bottom: 20px; }
  h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; margin: 0 0 10px; }
  p { margin: 0 0 22px; color: var(--text-soft); font-size: .9375rem; }
  a.btn {
    display: inline-block; background: var(--blue); color: #fff; text-decoration: none;
    font-weight: 700; font-size: .9375rem; padding: 12px 22px; border-radius: 999px;
  }
</style>
</head>
<body>
  <main class="card">
    <img src="/Assets/courtbit-logo.svg" alt="CourtBit" width="286" height="150">
    <h1>Los términos ahora viven en un solo lugar</h1>
    <p>Reunimos términos, aviso de privacidad, cookies y política de reembolsos en una sola página. Te estamos llevando ahí.</p>
    <a class="btn" href="/legal/#terminos-jugadores">Ver Términos y Condiciones</a>
  </main>
  <script>location.replace('/legal/#terminos-jugadores');</script>
</body>
</html>
